<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon</title>
  <meta name="description" content="This site is under construction.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fdf6ee;
      color: #2b2420;
    }
    h1 {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      margin-bottom: 12px;
      animation: up .8s ease both;
    }
    p {
      font-size: 1.1rem;
      color: #7a6a60;
      animation: up .8s .2s ease both;
    }
    .dots { margin-bottom: 28px; }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin: 0 5px;
      border-radius: 50%;
      background: #e8684a;
      animation: bob 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes bob {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-10px); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1614; color: #f3ebe4; }
      p { color: #b3a49a; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <h1>Something new is on the way</h1>
    <p>This site is under construction. Check back soon.</p>
  </main>
</body>
</html>
